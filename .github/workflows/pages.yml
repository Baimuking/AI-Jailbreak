name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "prompts/**"
      - "tools/**"
      - "techniques/**"
      - "sources/**"
      - "scripts/**"
      - "README.template.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 重建索引数据
        run: python scripts/build_index.py

      - name: 校验产物
        run: python scripts/build_index.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
